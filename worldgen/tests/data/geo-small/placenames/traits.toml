# Region names: words for a region's character (spec
# docs/specs/p1-06-regions.md, revision r3, RG11 and section 4.1). Kind
# `placename`, role "trait": at most one definition per trait. A region has
# a trait when its table `region` figures pass the trait's test (tuning
# worldgen.regions, record name_traits); the lists of all its traits, in the
# order coast, river, lake, high, ore, pass, barren, fertile, form pool 2 of
# every slot. Nouns stay with the land, so every trait's `nouns` is empty.

[placename.trait_coast]
role = "trait"
biomes = []
special = "none"
trait = "coast"
forms = []
nouns = []
suffixes = ["strand"]
prefixes = [
  "Brine", "Gull", "Kelp", "Salt", "Shingle", "Spray", "Tern", "Tide",
  "Wrack",
]
adjectives = ["Drowned", "Salt", "Windswept", "Wrecked"]
features = ["mouth", "strand"]
possessors = ["Gull", "Wrecker"]
places = ["Landing", "Strand"]
objects = ["Gulls", "Tides", "Wreckers", "Wrecks", "the Drowned"]
forbidden = []
excluded = []


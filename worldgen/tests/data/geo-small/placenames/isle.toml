# Region names of one land (spec docs/specs/p1-06-regions.md, revision r3,
# RG11 and section 4.1). A region alone on a landmass that is not the largest (noun Isle).
# Pool 1 of every slot for the regions of this land; common.toml is pool 0
# and the region's traits (traits.toml) pool 2. Lists sorted, no duplicates.

[placename.isle]
role = "land"
biomes = []
special = "isle"
trait = "none"
forms = [
  { form = "{prefix}{suffix}", weight = 30 },
  { form = "The {adjective} {noun}", weight = 22 },
  { form = "{prefix}{feature} {noun}", weight = 22 },
  { form = "The {noun} of {object}", weight = 12 },
  { form = "{possessor}'s {noun}", weight = 9 },
  { form = "{possessor}'s {place}", weight = 5 },
]
nouns = [
  "Holm", "Isle", "Rock", "Skerry", "Stack",
]
suffixes = [
  "holm", "rock", "skerry", "stack",
]
prefixes = [
  "Brine", "Cormorant", "Gannet", "Gull", "Kelp", "Salt", "Seal", "Shell",
  "Skua", "Spray", "Tern", "Tide", "Wrack",
]
adjectives = [
  "Drowned", "Salt", "Sunken", "Windswept",
]
features = []
possessors = []
places = []
objects = [
  "Gannets", "Gulls", "Seals", "Tides", "Wrecks", "the Drowned",
]
forbidden = []
excluded = []

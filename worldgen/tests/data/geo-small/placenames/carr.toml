# Region names of one land (spec docs/specs/p1-06-regions.md, revision r3,
# RG11 and section 4.1). Wet woodland (noun Carr).
# Pool 1 of every slot for the regions of this land; common.toml is pool 0
# and the region's traits (traits.toml) pool 2. Lists sorted, no duplicates.

[placename.carr]
role = "land"
biomes = ["wet_woodland"]
special = "none"
trait = "none"
forms = [
  { form = "{prefix}{suffix}", weight = 30 },
  { form = "The {adjective} {noun}", weight = 22 },
  { form = "{prefix}{feature} {noun}", weight = 22 },
  { form = "The {noun} of {object}", weight = 12 },
  { form = "{possessor}'s {noun}", weight = 9 },
  { form = "{possessor}'s {place}", weight = 5 },
]
nouns = [
  "Carr", "Carrs", "Holt", "Osiers", "Sallows", "Thicket", "Withies", "Wood",
]
suffixes = [
  "carr", "holt", "sallow", "shaw", "sike", "wood",
]
prefixes = [
  "Alder", "Eel", "Heron", "Leech", "Mist", "Osier", "Otter", "Reed", "Rush",
  "Sedge", "Silt", "Willow", "Withy",
]
adjectives = [
  "Dank", "Dripping", "Drowned", "Fogbound", "Mossgrown", "Rank", "Rotting",
  "Sodden", "Sunken", "Weeping",
]
features = [
  "mire", "pool",
]
possessors = []
places = []
objects = [
  "Alders", "Eels", "Herons", "Leeches", "Willows", "the Drowned",
]
forbidden = []
excluded = []

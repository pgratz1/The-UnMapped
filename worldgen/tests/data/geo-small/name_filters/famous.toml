# Name filter: famous names (spec docs/specs/p3-02-names.md, revision r5,
# section 11; not yet shipped: the loader ignores this directory until kind
# `name_filter` is registered). Gods of real religions, well-known names of
# fiction and games, famous places and peoples, and common modern first names
# that the shipped syllables can produce. Paul's rule for region names
# (2026-11-19) applies: famous real and fictional names are excluded,
# incidental likeness to obscure ones is not a concern.
# Lower-case a-z only, 2 to 16 letters; keep the list sorted, no duplicates.

[name_filter.famous]
anywhere = []
at_start = []
whole = [
  "aesir", "alan", "allie", "amon", "amy", "anna", "anne", "annie", "ares",
  "ariel", "asia", "aslan", "athena", "baal", "balder", "bali", "balin",
  "bombur", "bowie", "brent", "conan", "dagda", "dali", "durin", "eden",
  "ella", "ellie", "elrond", "enlil", "erie", "eris", "eros", "ethan",
  "ethel", "gog", "gondor", "greek", "grimm", "hermes", "hindi", "huck",
  "ian", "ibo", "indra", "iran", "isis", "ithaca", "kali", "kirk", "kurd",
  "lao", "lethe", "lilith", "lima", "lisa", "lori", "lorie", "lorien", "lou",
  "louie", "mack", "mafia", "mali", "mammon", "mao", "marduk", "marie",
  "mazda", "miami", "mick", "milo", "mimi", "mordor", "nero", "nile", "ollie",
  "pisa", "rama", "reno", "rome", "rosie", "sara", "sasha", "satan", "sean",
  "selene", "shiva", "sith", "siva", "sofia", "stan", "tasha", "thad", "thai",
  "thor", "thorin", "toby", "turin", "turk", "ural", "vanir", "vera", "wii",
]

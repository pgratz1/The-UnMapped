# P4-01 13.3 T1 timeline edges. Format: README.md in this directory (the P3-07 fixture format of
# ../history-report/README.md with [[layer]] entries).
#
# E = 2000. Two races interleaved by civilization id (c1 elf, c2 dwarf, c3 elf, c4 dwarf). Region ids 1, 2,
# 3, 4, 6 (no region 5; the layer uses value 5 for cells of no region row).
#   r1 held by c1 from 0, open.
#   r2 held by c3 [300, 1200), free [1200, 1300), held by c3 again from 1300 (held, lost, retaken).
#   r3 held by c2 [1000, 1600), then by c1 from 1600 (a change of holder in one year).
#   r4 held by c4 [1010, 1800), then free (freed: since 1800).
#   r6 never held (since 0).
#   s1 census gap 149 to 1500; s2 ruined 1200, faded 1400; s5 ruined 1800; s6 founded 1900.
#   Relations (primary-key order): 0 war c1-c2 [1500, 1600); 1 enmity c1-c4 from 1100, open;
#   2 war c2-c4 1550-1550 (until = since: in force in no year); 3 enmity c3-c4 [1300, 1999).
#   c2 ends in 1600. Multi-year events e12 1150-1499, e22 1590-1600, e27 1950-1999.
#   e21: two causes (17, 19); c1 as host and guest; s1 as place and site; r6 only as a participant.


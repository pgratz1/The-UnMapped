# P4-04 10.2 item 3, fixture T2 (settlement and place markers). Format: README.md in this directory (the
# P3-07 fixture format of ../history-report/README.md with a [markers] table: region seed cells and pass rows).
#
# E = 2000, one race (elf), civilizations c1 Alder, c2 Birch, c3 Cedar.
#   s1 Ashford   (100, 100) r1: founded 0 by c1 (settlement_founded: c1's capital); town from 400; declining
#                1000 to 1599; thriving from 1600. c1's capital moves to s4 in 900 (capital_moved).
#   s2 Birchholm (300, 100) r2: founded 100 by c2 (c2's capital); besieged 1380-1399; a battle and its capture
#                by c1 in 1400 (owner change: c2 alive without a capital until it ends in 1500).
#   s3 Cedarwick (150, 300) r3: colony of c1 in 600; secedes as c3 in 1200 (civ_seceded: c3's capital).
#   s4 Duskhold  (60, 200)  r1: a fortress colony of c1 in 500; c1's capital from 900.
#   s5 Emberly   (320, 150) r2: colony of c2 in 200; abandoned 1300 (ruined; settlement.ruin_event 17).
#   s6 Fallow    (220, 420) r3: colony of c1 in 300; sacked 800 (ruined, e11); faded 1100 (e15 ruin_faded, caused
#                by e11); its row has ruined_year NULL and ruin_event 0, so its ruin event is found only through
#                ruin_faded. A pilgrimage to its cell in 1500 (a ring at a faded ruin's cell).
#   s7 Gloam     (400, 300) r2: colony of c1 in 1900 (absent before).
#   Events with only a region: e19 claim (1400), e27 battle_at_pass (1950), both at r4's seed (450, 450); with
#   neither: e13 and e20 (omen). Multi-year: e18 siege 1380-1399, e24 plague_outbreak 1500-1502.
#   Passes: p1 lowered at (250, 250), p2 natural gap at (10, 500).

[meta]
seed = 404
seed_phrase = ""
map_size = 512
history_span = 2000
history_detail = "normal"
races = "elf"
civs_per_race = "auto"
event_intensity = "normal"
monster_pressure = "normal"
divine_activity = "normal"
divine_script = ""

[tables]
# [id, key, name, colour, water]
biome = [
    [1, "grassland", "Grassland", 6332480, 0],
    [2, "marsh", "Marsh", 4222048, 0],
]
# [id, name, biome, cells, lake_cells, walk_cells]
region = [
    [1, "West Vale", 1, 4000, 0, 4000],
    [2, "East Reach", 1, 5000, 0, 5000],
    [3, "South Fen", 2, 3000, 0, 3000],
    [4, "Far Moor", 2, 2000, 0, 2000],
]
race = [[1, "elf", "Elf", "Elves", "Elven", 0, 600, 500, 1, 1, 0, 1]]
culture = [[1, "elven", "Elven", 1]]
god = [[1, "Fielie", 0]]
age = [[1, 1, 0, 1999, "The Age of Elves"]]
# [id, age, kind, start_year, end_year, trigger_event]
phase = [
    [1, 1, 1, 0, 149, 1],
    [2, 1, 2, 150, 1899, 0],
    [3, 1, 4, 1900, 1999, 0],
]
# [id, name, race, culture, home_region, capital, founded_year, founding_event, ended_year, ending_event]
civilization = [
    [1, "Alder", 1, 1, 1, 4, 0, 2, -1, 0],
    [2, "Birch", 1, 1, 2, 2, 100, 4, 1500, 23],
    [3, "Cedar", 1, 1, 3, 3, 1200, 16, -1, 0],
]
# [id, name, x, y, region, founder_civ, founded_year, founding_event, owner_civ, kind, status, population,
#  ruined_year, ruin_event]
settlement = [
    [1, "Ashford", 100, 100, 1, 1, 0, 3, 1, 3, 1, 1000, -1, 0],
    [2, "Birchholm", 300, 100, 2, 2, 100, 5, 1, 2, 1, 200, -1, 0],
    [3, "Cedarwick", 150, 300, 3, 1, 600, 10, 3, 2, 1, 450, -1, 0],
    [4, "Duskhold", 60, 200, 1, 1, 500, 9, 1, 5, 1, 300, -1, 0],
    [5, "Emberly", 320, 150, 2, 2, 200, 6, 0, 1, 3, 0, 1300, 17],
    [6, "Fallow", 220, 420, 3, 1, 300, 7, 0, 2, 4, 0, -1, 0],
    [7, "Gloam", 400, 300, 2, 1, 1900, 26, 1, 1, 1, 40, -1, 0],
]
# [settlement, year, owner_civ, kind, status, population]
settlement_census = [
    [1, 0, 1, 1, 1, 100], [1, 400, 1, 3, 1, 1500], [1, 1000, 1, 3, 2, 900], [1, 1600, 1, 3, 1, 1000],
    [2, 100, 2, 2, 1, 300], [2, 1400, 1, 2, 1, 200],
    [3, 600, 1, 1, 1, 80], [3, 1000, 1, 2, 1, 400], [3, 1200, 3, 2, 1, 450],
    [4, 500, 1, 5, 1, 300],
    [5, 200, 2, 1, 1, 50], [5, 1300, 0, 1, 3, 0],
    [6, 300, 1, 2, 1, 200], [6, 800, 0, 2, 3, 0], [6, 1100, 0, 2, 4, 0],
    [7, 1900, 1, 1, 1, 40],
]
# [region, from_year, to_year, civ, event]
region_control = [
    [1, 0, -1, 1, 2],
    [2, 100, 1400, 2, 4],
    [2, 1400, -1, 1, 22],
    [3, 300, 1200, 1, 7],
    [3, 1200, -1, 3, 16],
]

# P4-04: the region seed cells ([id, seed_x, seed_y]; the P3-07 format leaves them 0) and table pass
# ([id, range_id, kind, capped, col_x, col_y, saddle_dm, col_dm, [path cell indices]]; the path is written as
# u32 little-endian, 4 bytes per cell, P1-01 9.1). The C++ builder writes the passes in the stage `biomes`.
[markers]
region_seed = [[1, 40, 50], [2, 300, 60], [3, 200, 400], [4, 450, 450]]
pass = [
    [1, 1, 1, 0, 250, 250, 12000, 11000, [128249, 128250]],
    [2, 2, 0, 0, 10, 500, 3000, 3000, [256010]],
]


# Name filter: ordinary English words (spec docs/specs/p3-02-names.md,
# revision r5, section 11; not yet shipped: the loader ignores this directory
# until kind `name_filter` is registered). A drawn root that is, or has a part
# (split at ' and -) that is, an ordinary English word reads as a translation
# or a joke ("Bald", "Buzz", "Dog Fort", "The Bag Horde"), so it is redrawn.
# The list is every lower-case word of the system English word lists
# (american-english and british-english) of 3 or more letters that the six
# shipped cultures reach as a root part with probability 1/100,000 or more per
# attempt (r5 11.6), plus a few comic words added by hand. Words a culture
# cannot reach do no harm; after a syllable edit, rerun the measurement of
# 11.6 to see which words become reachable.
# Lower-case a-z only, 2 to 16 letters; keep the list sorted, no duplicates.


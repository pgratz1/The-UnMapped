# P5-03a 14 item 11: H15 v6 (format v6, schema 10), from H14. Four races (elf 1, dwarf 2, goblin 3, human 4) and
# four realms. The elves and goblins meet wary (e25), come to hate one another after the goblins take Fievos (e35,
# e37) and grow wary again after long years of peace (e49, a warmer turn citing the meeting: "from hatred"). The
# dwarves have word of the goblins (e41, sealed 1: "by word"); elves and dwarves never meet; the humans meet no one.
# Four settlement_mixed events of two race pairs (elf-goblin e36, e39; dwarf-goblin e45, e52): only the first of each
# pair is a summary candidate (9.5). One arrival (e44, the dwarves of plague-struck Duldum: causes the plague and the
# abandonment, 7.3) and one expulsion (e47, standing 0, years 500). Seventeen ruins of seventeen ruined years and
# sizes (9.3). The goblin realm has more than eight milestone events, two of them quiet stretches (e46, e48; the
# longer, e48, is the one milestone of its kind, P3-07 24.5), two wars; the elves an enmity without war with the
# dwarves (9.2: no "without war" line).

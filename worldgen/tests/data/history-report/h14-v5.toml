# P5-03 24.1 item 11: H14 v5 (format v5, schema 10). Three races (elf 1, goblin 2, human 3) and three realms.
# The elves and goblins meet in hatred (e9); the goblins and humans meet wary (e15) and, after the goblins sack
# Ashford (e21), come to hate one another (e22); elves and humans never meet. The goblins take Fievos from the
# elves (e16: elves subject, mixed e17), and drive the elves out (e24), who find shelter in Durnhold (e25). The
# elves sack the goblin hamlet Gorzak (e18), whose survivors find shelter in Durnhold (e19), held as subjects from
# the phase start of 1000 (e23): Durnhold is mixed of three races. Grakh the Gaunt, an ogre, appears (e27), raids
# Nub Pit three times (e28 to e30, a chain of causes), the people flee for fear (e31, e32: ending 6, survivors to
# Durnhold) and it is slain (e33): told by the summary's floor (harm 270 + 500) and listed among the ended monsters.

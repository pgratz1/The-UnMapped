# P5-02 19.1 item 15: H13 v4 (format v4, schema 9). Two monsters: Old Grakh, a troll, appears (e15), raids Dunton
# (e16), whose people then leave it (ending 5, `left`), and is slain by the Kingdom of Bel (e18); Saelith the Black,
# a dragon, appears in a quiet step (e20) and starts a flare-up (e21, the note of 12.7), raids and overruns Arnwick
# (e22, e23: ending 2, a lair at the settlement's cell, region 1 not released since Arnton stands there) and sleeps
# (e24). Two outposts, one left when its frontier fell quiet (e33, ending 6). Ghost places of every ending: Corford
# abandoned after plague (3, with survivors to Arnton), Belham after famine (4), Dunton after a raid (5); Eldstead
# sacked (1) in Eld Wood, renamed The Red Wood after its ruin (the ruins list's `then called`). A boldness of the
# wolves (e19, {@beast}). Beasts bear and wolf with rows at 0 and E - 1. Written by the test writer from the spec
# (P5-02 10, 11, 12); format: README.md in this directory.


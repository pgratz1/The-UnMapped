# P4-05 10.2, fixture T3 (the browser of civilizations and events). Format: README.md in this directory (the
# P3-07 fixture format of ../history-report/README.md with the [markers] table of ../markers/README.md; T3 has
# region seed cells and no pass). Written by the test writer from docs/specs/p4-05-browser.md r1.
#
# E = 2000, two races: humans (ra1, awaken 0) and dwarves (ra2, awaken 1000).
#   c1 The Kingdom of Arn (human, home r1, capital s1), alive; an enmity with f1 (entity type 6, no name).
#   c2 Belmark (human), seceded from c1 in 500 with s3 (e6); s3 retaken by c1 in 1400 (e18): alive, capital 0.
#   c3 Stonehelm (dwarf, home r4 upland), founded 1000; war on c1 from 1250; conquered by c1 in 1800 (e22).
#   r2 The Holt of Yews, renamed The Red Holt in 1300 (e15, after the battle e14); e4's sentence names it by its
#   former name. r5 Cor Wold, renamed Ash Wold (1600, e20) and Grey Wold (1700, e21), no namer.
#   s4 Khazad with a-circumflex (bytes 4b 68 61 7a c3 a2 64): a non-ASCII name.
#   Cause chain e1 -> e2 -> e3 -> e5; e2 has two effects (e3, e4), e13 two (e14, e16).
#   Multi-year: e16 siege 1350-1360, e19 summit 1500-1502 (three parties).
#   Test kinds outside the shipped catalogue: omen, craft ({race:adjective}), summit ({parties:all}).


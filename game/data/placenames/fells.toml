# Region names of one land (spec docs/specs/p1-06-regions.md, revision r3,
# RG11 and section 4.1). An upland region whose dominant biome keeps no own noun (noun Fells).
# Pool 1 of every slot for the regions of this land; common.toml is pool 0
# and the region's traits (traits.toml) pool 2. Lists sorted, no duplicates.

[placename.fells]
role = "land"
biomes = []
special = "upland"
trait = "none"
forms = [
  { form = "{prefix}{suffix}", weight = 30 },
  { form = "The {adjective} {noun}", weight = 22 },
  { form = "{prefix}{feature} {noun}", weight = 22 },
  { form = "The {noun} of {object}", weight = 12 },
  { form = "{possessor}'s {noun}", weight = 9 },
  { form = "{possessor}'s {place}", weight = 5 },
]
nouns = [
  "Brows", "Crags", "Edges", "Fell", "Fells", "Heights", "Scars", "Uplands",
]
suffixes = [
  "brow", "crag", "edge", "fell", "knott", "rigg", "scar",
]
prefixes = [
  "Cloud", "Eagle", "Frost", "Hail", "Ice", "Mist", "Rime", "Scree", "Shale",
  "Slate",
]
adjectives = [
  "Cloven", "High", "Sheer", "Steep",
]
features = []
possessors = []
places = []
objects = [
  "Eagles", "Echoes", "the Mist",
]
forbidden = []
excluded = []

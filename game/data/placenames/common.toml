# Region names: the words every land shares (spec docs/specs/p1-06-regions.md,
# revision r3, RG11 and section 4.1). Kind `placename`, role "common": exactly
# one definition of this role. The lists here are pool 0 of every slot; each
# land (wood.toml, fen.toml, ...) adds pool 1 and the region's traits
# (traits.toml) pool 2. Words fit any land: no land nouns (Wood, Fen, Moor,
# ...), no compass words, no plants or beasts tied to one land.
#
# Grammars: prefixes, adjectives, possessors and places are one capitalised
# word ([A-Z][a-z]*); features and suffixes are lower case ([a-z]+); objects
# are a capitalised word, optionally after "the ". Keep each list sorted and
# free of duplicates (the loader refuses a word listed twice in one list).

[placename.common]
role = "common"
biomes = []
special = "none"
trait = "none"
forms = []
nouns = []
suffixes = []

# First half of a one-word compound ("Thorn" + "holt") and of the qualifier
# in "{prefix}{feature} {noun}" ("Black" + "water" Fen).
prefixes = [

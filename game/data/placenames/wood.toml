# Region names of one land (spec docs/specs/p1-06-regions.md, revision r3,
# RG11 and section 4.1). Temperate forest (noun Wood).
# Pool 1 of every slot for the regions of this land; common.toml is pool 0
# and the region's traits (traits.toml) pool 2. Lists sorted, no duplicates.

[placename.wood]
role = "land"
biomes = ["temperate_forest"]
special = "none"
trait = "none"
forms = [
  { form = "{prefix}{suffix}", weight = 30 },
  { form = "The {adjective} {noun}", weight = 22 },
  { form = "{prefix}{feature} {noun}", weight = 22 },
  { form = "The {noun} of {object}", weight = 12 },
  { form = "{possessor}'s {noun}", weight = 9 },
  { form = "{possessor}'s {place}", weight = 5 },
]
nouns = [
  "Brake", "Forest", "Grove", "Holt", "Hurst", "Shaw", "Tangle", "Thicket",
  "Weald", "Wood", "Woods",
]
suffixes = [
  "brake", "den", "grove", "hanger", "holt", "hurst", "shaw", "wood",
]
prefixes = [
  "Badger", "Bark", "Beech", "Birch", "Boar", "Bough", "Buck", "Elm", "Fern",
  "Hazel", "Hind", "Jay", "Larch", "Lichen", "Linden", "Mistle", "Oak",
  "Pine", "Roe", "Root", "Spindle", "Stag", "Wych",
]
adjectives = [
  "Brambled", "Gnarled", "Mossgrown", "Overgrown", "Primeval",
  "Tangled", "Thorned",
]
features = []
possessors = []
places = []
objects = [
  "Antlers", "Boars", "Oaks", "Stags", "Yews", "the Hunt",
]
forbidden = []
excluded = []

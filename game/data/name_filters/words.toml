# Name filter: English words that make a name read as a joke (spec
# docs/specs/p3-02-names.md, section 11, revision r8). A drawn root that is, or
# has a part (split at ' and -) that is, one of these words is redrawn. Paul's
# decision of 2026-11-20: only words that are crude, comic or modern-sounding
# are rejected ("Dork", "Bag Hole", "The House of Movie"), and function words
# and inflected forms, whose names read as an error ("The Kingdom of Went").
# Ordinary English words that fit the setting stay as name roots ("The Kingdom
# of Gold", "Thorn Deep", "Moss Hollow"). The list is drawn from the words of
# the system English word lists that the six shipped cultures reach as a root
# part with probability 1/100,000 or more per attempt, plus a few comic words
# added by hand; the reasons for each word are in section 11.11. Words a
# culture cannot reach do no harm.
# Lower-case a-z only, 2 to 16 letters; keep the list sorted, no duplicates.

[name_filter.words]
anywhere = [
  "dead", "flop", "gramma", "hack", "whop",
]
at_start = [
  "gord",
]
